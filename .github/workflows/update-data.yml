name: update-data

# 분기 실적만 수집 (발행사 잔액은 update-balance.yml 에서 수동 실행)
on:
  workflow_dispatch:          # 수동 실행 (Actions 탭 → Run workflow)
  push:                       # 실적 수집 코드가 바뀌면 다시 수집
    branches: [main]
    paths:
      - scripts/fetch_earnings.py
      - scripts/dart.py
      - .github/workflows/update-data.yml
  schedule:
    # 평일 하루 3번 (KST 08:17 / 13:17 / 19:17) — cron 은 UTC 기준
    # 정시(:00)는 GitHub 예약 작업이 몰려 몇 시간씩 밀리거나 빠지므로 17분으로 비켜 둠
    - cron: "17 23 * * 0-4"    # KST 08:17 (월~금) = 전날 UTC 23:17
    - cron: "17 4,10 * * 1-5"  # KST 13:17, 19:17

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false   # 돌고 있는 수집은 끊지 않고, 새 실행은 대기

env:
  PYTHONUNBUFFERED: "1"       # 로그가 실행 중에 바로 보이도록
  TZ: Asia/Seoul              # 수집일(N 표시 기준)을 한국 날짜로

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 분기 실적
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_earnings.py
      - name: 실적 데이터 커밋
        if: always()
        run: bash scripts/commit_data.sh "data - 분기 실적 갱신" data/earnings.json
