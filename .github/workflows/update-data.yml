name: update-data

on:
  workflow_dispatch:          # 수동 실행 (Actions 탭 → Run workflow)
  push:                       # 수집 코드가 바뀌면 다시 수집
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-data.yml
  schedule:
    - cron: "0 22 * * 0-4"    # 평일 07:00 KST

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 대상 기업 목록 (회사채·CP·전단채 잔액 확인)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_universe.py
      - name: 분기 실적
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_earnings.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: 자동 갱신"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
