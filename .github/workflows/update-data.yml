name: update-data

on:
  workflow_dispatch:        # 수동 실행 (데이터 소스 확정 후 schedule 추가)
  # schedule:
  #   - cron: "0 22 * * 0-4"  # 평일 07:00 KST

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python scripts/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: 자동 갱신"
          git push
